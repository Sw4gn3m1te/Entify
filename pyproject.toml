[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entify"
version = "0.2.0"
description = "Detect, count and highlight objects in images with pretrained models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "tensorflow",
    "keras",
    "keras-hub",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pillow",
]

[project.scripts]
entify = "entify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
