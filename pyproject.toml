[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entify"
version = "0.4.6"
description = "Detect, count and highlight objects in images with pretrained models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "tensorflow",
    "keras",
    "keras-hub",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
review = ["fastapi", "uvicorn"]

[project.scripts]
entify = "entify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
entify = ["review/static/*"]
